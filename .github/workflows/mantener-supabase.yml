# Supabase pausa los proyectos gratuitos después de unos días sin uso (y con eso se cae el login de Returnly).
# Esta tarea llama una vez por día a la función public.ping() de la base para que el proyecto siga activo.
# También se puede correr a mano: pestaña Actions -> "Mantener Supabase activo" -> Run workflow.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 12 * * *' # todos los días, 9:17 de Uruguay
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a ping() en Supabase
        env:
          SUPABASE_URL: https://zxwudwagkowbxaonzaoh.supabase.co
          # Clave PUBLICABLE (pensada para ser pública). Con ella no se puede leer ninguna tabla de Returnly:
          # todas tienen RLS sin políticas. Solo puede ejecutar ping().
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_SI5xXO3npg39n1cJFf9n2A_qqZgzOae
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Supabase respondió: el proyecto sigue activo."
